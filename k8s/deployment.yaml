
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusconnect-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campusconnect-app
  template:
    metadata:
      labels:
        app: campusconnect-app
    spec:
      containers:
        - name: campusconnect
          image: lavanyapc/campusconnect:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: DB_URL
              value: "jdbc:postgresql://campusconnect-db:5432/campusconnect"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: campusconnect-db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campusconnect-db-secret
                  key: DB_PASSWORD

