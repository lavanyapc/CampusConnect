apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: campusconnect-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusconnect-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campusconnect-db
  template:
    metadata:
      labels:
        app: campusconnect-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "campusconnect"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: campusconnect-db-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campusconnect-db-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: campusconnect-db-pvc
