
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusconnect-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campusconnect-db
  template:
    metadata:
      labels:
        app: campusconnect-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "campusconnect"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: campusconnect-db-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campusconnect-db-secret
                  key: DB_PASSWORD

